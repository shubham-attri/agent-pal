<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Pal - Test Chat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #343541;
      color: #ececf1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #test-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .chat-message {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
    }
    
    .user-message {
      background-color: #3b82f6;
      align-self: flex-end;
    }
    
    .assistant-message {
      background-color: #6b7280;
      align-self: flex-start;
    }
    
    .input-area {
      padding: 10px;
      background-color: #444654;
      margin-top: auto;
      display: flex;
    }
    
    input {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #6b7280;
      background-color: #1f2937;
      color: white;
    }
    
    button {
      margin-left: 8px;
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      background-color: #10b981;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="test-container">
    <!-- Messages will appear here -->
    <div id="messages-container" style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column;"></div>
    
    <!-- Input area -->
    <div class="input-area">
      <input id="message-input" type="text" placeholder="Type a message...">
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    // Simple test script - no dependencies on Electron or other components
    document.addEventListener('DOMContentLoaded', function() {
      const messagesContainer = document.getElementById('messages-container');
      const messageInput = document.getElementById('message-input');
      const sendButton = document.getElementById('send-button');
      
      // Add a system message
      addMessage('System', 'Test chat interface is ready. This page works without Electron to help isolate issues.');
      
      // Send button handler
      sendButton.addEventListener('click', function() {
        const message = messageInput.value.trim();
        if (message) {
          addMessage('User', message);
          messageInput.value = '';
          
          // Simulate response
          setTimeout(() => {
            addMessage('Assistant', `This is a test response to: "${message}"`);
          }, 1000);
        }
      });
      
      // Enter key handler
      messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendButton.click();
        }
      });
      
      // Focus input
      messageInput.focus();
      
      // Function to add a message
      function addMessage(role, content) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `chat-message ${role.toLowerCase()}-message`;
        messageDiv.textContent = content;
        messagesContainer.appendChild(messageDiv);
        
        // Scroll to bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    });
  </script>
</body>
</html>
