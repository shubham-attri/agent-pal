<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Pal</title>
  <style>
    @font-face {
      font-family: 'Jersey 20';
      src: local('Jersey 20'), local('Jersey20');
      font-weight: normal;
      font-style: normal;
    }
    
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Jersey 20', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .main-chat-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Fallback content if scripts fail to load */
    .fallback-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 20px;
    }

    .error-message {
      margin-top: 20px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      max-width: 80%;
      text-align: left;
      white-space: pre-wrap;
      overflow: auto;
    }
    
    .pal-logo {
      margin-bottom: 20px;
    }
    
    .pal-logo svg {
      width: 80px;
      height: 80px;
      color: #ffffff;
    }
  </style>
  <script>
    // Add error handler to show errors on page
    window.addEventListener('error', function(event) {
      console.error('Script error:', event.error);
      const errorDiv = document.getElementById('error-display');
      if (errorDiv) {
        errorDiv.textContent = 'Error: ' + (event.error ? event.error.message : event.message) + 
          '\n\nStack: ' + (event.error ? event.error.stack : '(No stack trace available)');
        errorDiv.style.display = 'block';
      }
    });
  </script>
  <!-- Load styles first -->
  <link rel="stylesheet" href="styles/main-chat.css">
</head>
<body>
  <div id="main-chat-container" class="main-chat-container">
    <div class="fallback-content">
      <div class="pal-logo">
        <svg width="80" height="80" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="92" y="65" width="37" height="50" rx="8" fill="currentColor"/>
          <rect x="37" y="11" width="50" height="50" rx="8" fill="currentColor"/>
          <rect x="37" y="118" width="50" height="50" rx="8" fill="currentColor"/>
          <rect x="47" y="23" width="32" height="26" rx="8" fill="white"/>
          <rect x="72" y="46" width="30" height="30" rx="8" fill="currentColor"/>
          <rect x="113" y="76" width="30" height="30" rx="8" transform="rotate(-90 113 76)" fill="currentColor"/>
          <rect x="73" y="100" width="30" height="30" rx="8" fill="currentColor"/>
          <rect x="113" y="130" width="30" height="30" rx="8" transform="rotate(-90 113 130)" fill="currentColor"/>
          <rect width="32" height="26" rx="8" transform="matrix(1 0 0 -1 47 153)" fill="white"/>
          <rect width="20" height="19" rx="4" transform="matrix(1 0 0 -1 76 126)" fill="white"/>
          <rect x="76" y="50" width="20" height="19" rx="4" fill="white"/>
        </svg>
      </div>
      <h2>Agent Pal</h2>
      <p>Loading chat interface...</p>
      <div id="error-display" class="error-message" style="display: none;"></div>
    </div>
  </div>

  <!-- Load the compiled script -->
  <script src="main-chat.js"></script>
</body>
</html>
